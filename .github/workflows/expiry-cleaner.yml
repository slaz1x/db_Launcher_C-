name: Expiry Cleaner Daily

on:
  schedule:
    - cron: "0 3 * * *"   # раз в сутки в 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-cleaner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Switch to baza
        run: git checkout baza

      - name: Run cleaner
        run: python expiry_cleaner_hourly.py